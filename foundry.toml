[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
test = "test/contracts"
script = "scripts"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/"
]
