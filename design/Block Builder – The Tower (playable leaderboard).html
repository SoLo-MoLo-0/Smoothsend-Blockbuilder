<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Block Builder — The Tower</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#111;--mute:#555;--line:#e8e8e8;--acc:#ff3b1f;--t3:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--card:#161616;--ink:#f2f2f2;--mute:#a3a3a3;--line:#1e1e1e;--acc:#ff5a3d;--t3:#8a8a8a}}
:root[data-theme="dark"]{--bg:#0e0e0e;--card:#161616;--ink:#f2f2f2;--mute:#a3a3a3;--line:#1e1e1e;--acc:#ff5a3d;--t3:#8a8a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
#card{max-width:760px;margin:0 auto;padding:20px 24px 48px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
.lg{flex:1;font-weight:700;font-size:15px;letter-spacing:-.02em;min-width:120px}
.tabs{display:flex}.tab{font-size:12px;font-weight:500;padding:8px 14px;border:2px solid var(--ink);margin-left:-2px}.tab.on{background:var(--ink);color:var(--bg)}
.clk{flex:1;text-align:right;font-size:12px;color:var(--mute);min-width:140px}.clk b{color:var(--ink);font-variant-numeric:tabular-nums}
.bump{display:inline-block;animation:bump .3s ease-out}
@keyframes bump{40%{transform:translateY(-3px);color:var(--acc)}}
.l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hd{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.st{position:relative;display:flex;gap:22px}
.st button{background:none;border:0;font:inherit;font-size:13px;color:var(--mute);padding:14px 0 12px;cursor:pointer;transition:color .15s}
.st button:hover,.st button.on{color:var(--ink)}
.st button:focus-visible,.btn:focus-visible,.col:focus-visible,button.row:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#ind{position:absolute;bottom:0;height:2px;background:var(--ink);transition:left .3s cubic-bezier(.3,1.5,.5,1),width .3s cubic-bezier(.3,1.5,.5,1)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px;align-items:center}
.btn{font:inherit;font-weight:500;font-size:14px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);padding:0 18px;min-height:44px;cursor:pointer;transition:transform .08s,background .15s,color .15s}
.btn:hover{background:var(--ink);color:var(--bg)}.btn:active{transform:translateY(2px) scale(.96)}
.btn.p{background:var(--ink);color:var(--bg)}.btn.p:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.45;pointer-events:none}
.np{font-size:13px;color:var(--mute)}
#pod{display:flex;justify-content:center;align-items:flex-end;gap:14px;height:320px;margin:8px 0 18px}
.col{display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;width:min(130px,29vw)}
.rn{font-size:32px;font-weight:700;line-height:1}
.w{font-size:12px;color:var(--mute);margin:4px 0 2px}
.sv{font-size:15px;font-variant-numeric:tabular-nums;margin-bottom:8px}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.3,1,.3,1);font-size:12px;color:var(--mute);line-height:1.5;width:100%}
.det>span{overflow:hidden;min-height:0;display:block}
.col:hover .det,.col:focus-visible .det{grid-template-rows:1fr}
.tw{width:100%;display:block}
.t{display:block;height:28px;margin-top:2px;transform-origin:50% 100%;animation:drop .75s cubic-bezier(.4,0,.6,1) both}
.c1 .t{background:var(--acc)}.c2 .t{background:var(--ink)}.c3 .t{background:var(--t3)}
@keyframes drop{0%{transform:translateY(-340px);opacity:0}8%{opacity:1}55%{transform:translateY(0) scaleY(1)}68%{transform:scaleY(.86)}84%{transform:scaleY(1.05)}100%{transform:scaleY(1)}}
.built .t{animation:none}
.built .col:hover .t,.built .col:focus-visible .t{animation:wave .45s calc(var(--i)*45ms) ease-out}
@keyframes wave{40%{transform:translateY(-9px)}}
.row{position:relative;display:grid;grid-template-columns:52px 1fr auto 40px;gap:8px;align-items:center;width:100%;box-sizing:border-box;min-height:46px;padding:0 6px;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;font-size:14px;color:var(--ink);text-align:left;font-variant-numeric:tabular-nums;overflow:hidden}
.row>span{position:relative;z-index:1;transition:color .15s}
.rk{font-weight:700}.sc{text-align:right}.pf{text-align:right}
.rh{min-height:30px;border-bottom:2px solid var(--ink);font-size:11px;letter-spacing:.12em;color:var(--mute)}
button.row{cursor:pointer;transition:transform .08s}
button.row::before{content:'';position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .22s cubic-bezier(.3,.9,.3,1)}
button.row:hover::before,button.row:focus-visible::before,.rw.open button.row::before{transform:scaleX(1)}
button.row:hover>span,button.row:focus-visible>span,.rw.open button.row>span{color:var(--bg)}
button.row:active{transform:scale(.995)}
.rw{animation:in .42s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--d,0)*55ms)}
@keyframes in{from{opacity:0;transform:translateX(-18px)}}
.rw.mine .row{box-shadow:inset 5px 0 0 var(--acc);font-weight:700}
.ex{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.3,1,.3,1)}
.rw.open .ex{grid-template-rows:1fr}.ex>div{overflow:hidden;min-height:0}
.exi{padding:12px 6px 14px 66px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.exi span{color:var(--ink);border-bottom:1px solid var(--ink)}
#mew{transition:max-height .5s cubic-bezier(.3,1,.3,1),opacity .35s;max-height:90px;overflow:hidden}
#mew.gone{max-height:0;opacity:0}
.gap{height:22px;text-align:center;color:var(--mute);letter-spacing:.3em;font-size:12px;line-height:22px}
.me{display:grid;grid-template-columns:52px 1fr auto 40px;gap:8px;align-items:center;min-height:50px;padding:0 6px;background:var(--card);box-shadow:inset 5px 0 0 var(--acc);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;animation:edge 1.1s 1.8s 2}
@keyframes edge{50%{box-shadow:inset 12px 0 0 var(--acc)}}
.k{font-size:12px;color:var(--mute);margin-top:14px;line-height:1.6}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:40}
.pop{position:fixed;z-index:50;font-weight:700;font-size:24px;white-space:nowrap;pointer-events:none;animation:pop 1s cubic-bezier(.2,.8,.2,1) forwards}
.pop.big{font-size:40px;color:var(--acc);letter-spacing:-.02em}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}15%{opacity:1;transform:translate(-50%,0) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
@media (max-width:520px){.big{font-size:26px}#pod{height:300px;gap:8px}.exi{padding-left:60px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="fxc"></canvas>
<div id="card">
<div class="bar"><div class="lg">BLOCK BUILDER</div><div class="tabs"><span class="tab">Practice</span><span class="tab">Daily 100</span><span class="tab on" aria-current="page">Leaderboard</span></div><div class="clk">Resets in <b id="clk"></b></div></div>
<div class="hd"><div><div class="l" id="lab"></div><div class="big" id="ttl"></div></div><div class="np" id="np"></div></div>
<div class="st" role="tablist"><button data-t="today" role="tab">Today</button><button data-t="all" role="tab">All time</button><button data-t="streak" role="tab">Streaks</button><i id="ind"></i></div>
<div class="ctl"><button class="btn p" id="sub">Simulate my submission</button><button class="btn" id="snd" aria-pressed="true">Sound on</button></div>
<div id="pod"></div>
<div class="row rh"><span>RANK</span><span>PLAYER</span><span id="sh">SCORE</span><span style="text-align:right">PROOF</span></div>
<div id="list"></div>
<div id="mew"><div class="gap">···</div><div class="me" id="me"><span id="mr"></span><span>YOU · 0xa2f1…44d8</span><span id="ms"></span><span style="text-align:right">↗</span></div></div>
<p class="k">Everyone gets the same pieces today. Ties go to the earlier submission. Hover a column or tap a row for details.</p>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s),RM=matchMedia('(prefers-reduced-motion: reduce)').matches,fmt=n=>n.toLocaleString('en-US');
const NM=['0x9f3a…c21e','0x31bd…8a07','0xc7e2…19f4','0x5a90…e3b1','0x82d4…70ac','0x1e6f…b95d','0xd3c8…2e66','0x7b41…f0a9'];
const mk=(vs,dt)=>vs.map((v,i)=>({n:NM[i],v,d:dt(i)}));
const LN=[38,37,36,33,32,31,30,28],TM=['4m 12s','4m 40s','4m 05s','5m 02s','4m 51s','5m 18s','4m 33s','5m 40s'];
const TABS={
today:{lab:'Daily 100 · No. 104',ttl:'The tower',unit:'Score',n:'3,208 players',f:fmt,list:mk([48210,46880,45120,41990,40760,39300,38050,36420],i=>LN[i]+' lines · 100 pieces · '+TM[i]),me:{rank:142,v:28640}},
all:{lab:'Season 1',ttl:'All-time tower',unit:'Best score',n:'12,946 players',f:fmt,list:mk([71250,69880,66410,63200,61980,60120,58870,57340],i=>'Set on day No. '+[87,52,101,66,93,74,12,98][i]),me:{rank:1904,v:33410}},
streak:{lab:'Daily habit',ttl:'Streak tower',unit:'Streak',n:'2,771 active streaks',f:v=>v+' days',list:mk([64,58,51,47,45,41,39,36],i=>'Played every day since No. '+[40,46,53,57,59,63,65,68][i]),me:{rank:380,v:6}}};
const ORIG=JSON.stringify(TABS.today.list);
let tab='today',climbed=false,ac,sound=true,shake=0,parts=[],first=true;
document.addEventListener('pointerdown',()=>{try{ac=ac||new AudioContext();ac.resume()}catch(e){}},{once:true});
function beep(f,d=.06,t='square',v=.045,s=0){if(!sound||!ac||ac.state!=='running')return;try{const o=ac.createOscillator(),g=ac.createGain(),T=ac.currentTime+s;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d+.02)}catch(e){}}
function countTo(el,to,dur,delay,f,from=0){setTimeout(()=>{const t0=performance.now();(function s(n){const k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(s)})(t0)},delay)}
function podium(T){const top=T.list.slice(0,3),cnt=[5,4,3],del=[500,250,0],pod=$('#pod');pod.classList.remove('built');
pod.innerHTML=[1,0,2].map(i=>{const p=top[i];let t='';for(let k=cnt[i]-1;k>=0;k--)t+=`<i class="t" style="--i:${k};animation-delay:${del[i]+k*90}ms"></i>`;
return `<button class="col c${i+1}" aria-label="Rank ${i+1}, ${p.n}, ${T.f(p.v)}"><span class="rn">${i+1}</span><span class="w">${p.n}</span><b class="sv">${T.f(0)}</b><span class="det"><span>${p.d}<br>Proof ↗</span></span><span class="tw">${t}</span></button>`}).join('');
[1,0,2].forEach((i,c)=>{const el=pod.children[c].querySelector('.sv');countTo(el,top[i].v,RM?10:900,del[i]+cnt[i]*90,T.f);for(let k=0;k<cnt[i];k++)setTimeout(()=>beep(170+k*45+(2-i)*20,.07,'square',.05),del[i]+k*90+430)});
setTimeout(()=>pod.classList.add('built'),RM?0:1700)}
function rowH(r,p,T,d){return `<div class="rw${p.me?' mine':''}" data-k="${p.n}" style="--d:${d}"><button class="row" aria-expanded="false"><span class="rk">${r}</span><span>${p.n}</span><span class="sc">${T.f(p.v)}</span><span class="pf">↗</span></button><div class="ex"><div><div class="exi">${p.d} · <span>Proof ↗</span></div></div></div></div>`}
function renderList(T,stag){$('#list').innerHTML=T.list.slice(3).map((p,i)=>rowH(i+4,p,T,stag?i+(first?10:3):0)).join('')}
function setTab(n){tab=n;const T=TABS[n];document.querySelectorAll('.st button').forEach(b=>{const on=b.dataset.t===n;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);if(on)moveInd(b)});
$('#lab').textContent=T.lab;$('#ttl').textContent=T.ttl;$('#np').textContent=T.n;$('#sh').textContent=T.unit.toUpperCase();
podium(T);renderList(T,true);$('#mr').textContent=T.me.rank;$('#ms').textContent=T.f(T.me.v);$('#mew').classList.toggle('gone',n==='today'&&climbed);first=false}
function moveInd(b){const i=$('#ind');i.style.left=b.offsetLeft+'px';i.style.width=b.offsetWidth+'px'}
document.querySelectorAll('.st button').forEach(b=>b.onclick=()=>{if(b.dataset.t!==tab){beep(300,.05);setTab(b.dataset.t)}});
$('#list').addEventListener('click',e=>{const r=e.target.closest('button.row');if(!r)return;const w=r.parentElement,o=w.classList.contains('open');document.querySelectorAll('.rw.open').forEach(x=>{x.classList.remove('open');x.querySelector('.row').setAttribute('aria-expanded',false)});if(!o){w.classList.add('open');r.setAttribute('aria-expanded',true)}beep(o?260:380,.05)});
function flip(fn){const L=$('#list'),b=new Map([...L.children].map(e=>[e.dataset.k,e.getBoundingClientRect().top]));fn();if(RM)return;[...L.children].forEach(e=>{e.style.animation='none';const f=b.get(e.dataset.k);if(f==null)e.animate([{transform:'translateY(50px) scaleY(.6)',opacity:0},{transform:'none',opacity:1}],{duration:520,easing:'cubic-bezier(.2,1.5,.4,1)'});else{const d=f-e.getBoundingClientRect().top;if(d)e.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:520,easing:'cubic-bezier(.3,1.5,.5,1)'})}})}
function pop(t,x,y,big){const d=document.createElement('div');d.className='pop'+(big?' big':'');d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';d.onanimationend=()=>d.remove();document.body.appendChild(d)}
function burst(x,y,n){if(RM)return;for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*620,vy:-Math.random()*520-60,s:4+Math.random()*8,l:0,m:700+Math.random()*500,a:Math.random()<.35})}
const cv=$('#fxc'),cx=cv.getContext('2d');function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',()=>{rs();moveInd($('.st .on'))});
let last=0;(function loop(ts){const dt=Math.min(50,ts-(last||ts));last=ts;cx.clearRect(0,0,cv.width,cv.height);const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink'),acc=getComputedStyle(document.documentElement).getPropertyValue('--acc');
parts.forEach(p=>{p.l+=dt;p.vy+=1100*dt/1000;p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;cx.globalAlpha=Math.max(0,1-p.l/p.m);cx.fillStyle=p.a?acc:ink;cx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)});cx.globalAlpha=1;parts=parts.filter(p=>p.l<p.m);
shake*=Math.pow(.88,dt/16);$('#card').style.transform=shake>.3?`translate(${(Math.random()-.5)*shake}px,${(Math.random()-.5)*shake}px)`:'';requestAnimationFrame(loop)})(0);
function climb(){const btn=$('#sub');btn.disabled=true;const mr=$('#mr'),ms=$('#ms'),t0=performance.now();let lr=142,n=0;
(function f(now){const k=Math.min(1,(now-t0)/1300),e=1-Math.pow(1-k,3),r=Math.round(142+(6-142)*e);if(r!==lr){lr=r;mr.textContent=r;if(n++%3===0)beep(180+(142-r)*4,.03,'square',.035)}ms.textContent=fmt(Math.round(28640+(40010-28640)*e));if(k<1)requestAnimationFrame(f);else land()})(t0);
function land(){const T=TABS.today;climbed=true;T.list.splice(5,0,{n:'YOU · 0xa2f1…44d8',v:40010,d:'31 lines · 100 pieces · 4m 20s',me:true});flip(()=>renderList(T,false));$('#mew').classList.add('gone');
requestAnimationFrame(()=>{const el=$('.rw.mine'),r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;burst(x,y,50);pop('+136 places',x,y-10,false);setTimeout(()=>pop('TOP 10',x,y-60,true),250);shake=RM?0:8;[0,1,2,3].forEach(i=>beep(330*Math.pow(1.26,i),.12,'square',.055,i*.07))});
btn.textContent='Reset demo';btn.disabled=false;btn.onclick=reset}}
function reset(){const T=TABS.today;T.list=JSON.parse(ORIG);climbed=false;$('#sub').textContent='Simulate my submission';$('#sub').onclick=start;beep(220,.08);setTab(tab)}
function start(){if(tab!=='today'){setTab('today');setTimeout(climb,1700)}else climb()}
$('#sub').onclick=start;
$('#snd').onclick=function(){sound=!sound;this.textContent=sound?'Sound on':'Sound off';this.setAttribute('aria-pressed',sound)};
let secs=6*3600+42*60+18;function clk(){const h=secs/3600|0,m=secs%3600/60|0,s=secs%60,p=x=>String(x).padStart(2,'0');$('#clk').innerHTML=p(h)+':'+p(m)+':<span class="bump">'+p(s)+'</span>'}
clk();setInterval(()=>{secs=secs>0?secs-1:86399;clk()},1000);
setTab('today');document.fonts&&document.fonts.ready.then(()=>moveInd($('.st .on')));
</script></body></html>
